<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Crypto Dashboard</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#021b1b;
color:white;
text-align:center;
}

.card{
background:#064e3b;
margin:15px;
padding:15px;
border-radius:15px;
}

input{
padding:10px;
margin:10px;
border:none;
border-radius:6px;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#2fd39b;
color:white;
}

.grid{
display:flex;
gap:10px;
}

.grid button{
flex:1;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
background:#053b35;
display:flex;
justify-content:space-around;
padding:10px;
}

.page{display:none}
</style>

</head>

<body>

<h2>Demo Platform</h2>

<div id="loginPage">

<input id="phone" placeholder="Mobile number"><br>

<input id="pass" type="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<br><br>

<button onclick="showRegister()">Create account</button>

</div>


<div id="registerPage" class="page">

<input id="rphone" placeholder="Mobile number"><br>

<input id="rpass" type="password" placeholder="Password"><br>

<button onclick="register()">Register</button>

</div>


<div id="dashboard" class="page">

<div class="card">

<h3>Balance: $<span id="balance">0</span></h3>

</div>


<div class="card">

<h3>Daily Claim</h3>

<h2 id="timer">24:00:00</h2>

<button id="claimBtn" onclick="claim()" disabled>
Claim Demo Reward
</button>

</div>


<div class="card grid">

<button>Recharge (Demo)</button>

<button onclick="showReferral()">Refer</button>

</div>


<div class="card">

<h3>Referral</h3>

<input id="refLink" readonly style="width:90%">

<br><br>

<button onclick="copyRef()">Copy Link</button>

<p>Total Referrals: <span id="refCount">0</span></p>

</div>


<div class="card">

<h3>Withdraw (Demo)</h3>

<input id="amount" placeholder="Amount"><br>

<button onclick="withdraw()">Submit</button>

</div>

</div>


<div class="bottom">

<div>Home</div>

<div>Friends</div>

<div>Info</div>

<div>Task</div>

</div>


<script>

let user=localStorage.getItem("loginUser");

if(user){
showDashboard();
}

function login(){

let phone=document.getElementById("phone").value;
let pass=document.getElementById("pass").value;

let saved=localStorage.getItem("user_"+phone);

if(saved==pass){

localStorage.setItem("loginUser",phone);
showDashboard();

}else{

alert("Wrong login");

}

}

function register(){

let phone=document.getElementById("rphone").value;
let pass=document.getElementById("rpass").value;

localStorage.setItem("user_"+phone,pass);

alert("Account created");

document.getElementById("registerPage").style.display="none";
document.getElementById("loginPage").style.display="block";

}

function showRegister(){

document.getElementById("loginPage").style.display="none";
document.getElementById("registerPage").style.display="block";

}

function showDashboard(){

document.getElementById("loginPage").style.display="none";
document.getElementById("registerPage").style.display="none";
document.getElementById("dashboard").style.display="block";

createReferral();
startTimer();

}

function claim(){

let bal=document.getElementById("balance");

bal.innerText=parseInt(bal.innerText)+2;

localStorage.setItem("lastClaim",Date.now());

alert("Demo reward added");

}

function withdraw(){

let amount=document.getElementById("amount").value;

alert("Withdraw request submitted: $"+amount);

}

function createReferral(){

let id=localStorage.getItem("loginUser");

document.getElementById("refLink").value=
location.href+"?ref="+id;

}

function copyRef(){

navigator.clipboard.writeText(
document.getElementById("refLink").value
);

alert("Copied");

}

function startTimer(){

let claimBtn=document.getElementById("claimBtn");
let timerText=document.getElementById("timer");

let last=localStorage.getItem("lastClaim");

if(!last){

last=Date.now();
localStorage.setItem("lastClaim",last);

}

setInterval(()=>{

let diff=86400000-(Date.now()-last);

if(diff<=0){

timerText.innerText="Ready";
claimBtn.disabled=false;

}else{

let h=Math.floor(diff/1000/60/60);
let m=Math.floor(diff/1000/60)%60;
let s=Math.floor(diff/1000)%60;

timerText.innerText=h+":"+m+":"+s;

}

},1000);

}

</script>

</body>
</html>
