<!DOCTYPE html>
<html>
<head>
<title>Crypto Dashboard</title>

<style>
body{
background:#022c22;
color:white;
font-family:sans-serif;
text-align:center;
}

.card{
background:#064e3b;
padding:20px;
margin:20px;
border-radius:15px;
}

button{
background:#22c55e;
border:none;
padding:10px 20px;
margin:5px;
border-radius:10px;
color:white;
}

.page{
display:none;
}

</style>

<script>

function show(page){
document.getElementById("home").style.display="none";
document.getElementById("deposit").style.display="none";
document.getElementById("withdraw").style.display="none";
document.getElementById("invite").style.display="none";

document.getElementById(page).style.display="block";
}

</script>

</head>

<body>

<h1>Crypto Dashboard</h1>

<div id="home">

<div class="card">
<h2>Balance</h2>
<h3>$0.00</h3>
</div>

<button onclick="show('deposit')">Deposit</button>
<button onclick="show('withdraw')">Withdraw</button>
<button onclick="show('invite')">Invite</button>

</div>


<div id="deposit" class="page">

<div class="card">
<h2>Deposit USDT</h2>
<p>Send USDT to this wallet</p>
<p>TRC20_WALLET_ADDRESS</p>

<button onclick="show('home')">Back</button>
</div>

</div>


<div id="withdraw" class="page">

<div class="card">

<h2>Withdraw</h2>

<input placeholder="Wallet address"><br><br>
<input placeholder="Amount"><br><br>

<button>Submit</button>
<br><br>

<button onclick="show('home')">Back</button>

</div>

</div>


<div id="invite" class="page">

<div class="card">

<h2>Invite Friends</h2>

<p>Your referral link:</p>

<p>https://t.me/BTCTradingAI_bot</p>

<a href="https://t.me/BTCTradingAI_bot">
<button>Open Telegram Bot</button>
</a>

<br><br>

<button onclick="show('home')">Back</button>

</div>

</div>

</body>
</html>
