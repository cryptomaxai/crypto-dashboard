<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI BTC</title><style>

body{
margin:0;
font-family:sans-serif;
background:#022;
color:white;
}

.header{
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
}

.card{
background:#043c34;
margin:12px;
padding:15px;
border-radius:15px;
}

.balance{
font-size:28px;
text-align:center;
margin-top:10px;
}

.row{
display:flex;
justify-content:space-between;
}

button{
background:#21c087;
border:none;
padding:12px;
border-radius:10px;
color:white;
width:48%;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
background:#033;
display:flex;
justify-content:space-around;
padding:12px;
}

.bottom div{
cursor:pointer;
}

.page{
display:none;
}

</style></head><body><div class="header">AI BTC</div><!-- HOME --><div id="homePage"><div class="card">You Earned: $<span id="earned">0</span>

</div><div class="card"><div style="text-align:center">USDT / USDC

</div><div class="balance">$<span id="balance">0</span>

</div><div style="text-align:center">Settlement time:

<span id="timer">00:00:00</span>

</div></div><div class="card"><div class="row"><button onclick="recharge()">Recharge</button>

<button onclick="withdraw()">Withdraw</button>

</div></div></div><!-- FRIENDS --><div id="friendsPage" class="page"><div class="card"><h3>Referral Link</h3><input id="refLink" style="width:100%"><br><br>

<button onclick="copyRef()">Copy Link</button>

</div></div><!-- INTRO --><div id="introPage" class="page"><div class="card"><h3>Introduction</h3><p>AI BTC demo platform</p></div></div><!-- TASK --><div id="taskPage" class="page"><div class="card"><h3>Tasks</h3><p>Invite friends to earn rewards</p></div></div><!-- BOTTOM --><div class="bottom"><div onclick="showPage('home')">Home</div><div onclick="showPage('friends')">Friends</div><div onclick="showPage('intro')">Introduction</div><div onclick="showPage('task')">Task</div></div><script>

/* BALANCE */

let balance = localStorage.getItem("balance");

if(balance==null){

balance=0;

localStorage.setItem("balance",0);

}

document.getElementById("balance").innerText = balance;


/* RECHARGE */

function recharge(){

let amount = prompt("Enter recharge amount");

if(amount){

let bal = parseFloat(localStorage.getItem("balance"));

bal = bal + parseFloat(amount);

localStorage.setItem("balance",bal);

document.getElementById("balance").innerText = bal;

/* START 24h TIMER */

let endTime = Date.now() + 86400000;

localStorage.setItem("endTime",endTime);

alert("Recharge successful");

}

}


/* WITHDRAW */

function withdraw(){

let amount = prompt("Enter withdraw amount");

let bal = parseFloat(localStorage.getItem("balance"));

if(amount > bal){

alert("Not enough balance");

return;

}

bal = bal - amount;

localStorage.setItem("balance",bal);

document.getElementById("balance").innerText = bal;

alert("Withdraw request sent");

}


/* TIMER */

function timer(){

let endTime = localStorage.getItem("endTime");

if(!endTime){

document.getElementById("timer").innerText="00:00:00";

return;

}

let now = Date.now();

let diff = endTime - now;

if(diff <= 0){

document.getElementById("timer").innerText="00:00:00";

return;

}

let h = Math.floor(diff/3600000);

let m = Math.floor((diff%3600000)/60000);

let s = Math.floor((diff%60000)/1000);

document.getElementById("timer").innerText =
h + ":" + m + ":" + s;

}

setInterval(timer,1000);


/* PAGE SWITCH */

function showPage(page){

document.getElementById("homePage").style.display="none";

document.getElementById("friendsPage").style.display="none";

document.getElementById("introPage").style.display="none";

document.getElementById("taskPage").style.display="none";

if(page=="home")
document.getElementById("homePage").style.display="block";

if(page=="friends")
document.getElementById("friendsPage").style.display="block";

if(page=="intro")
document.getElementById("introPage").style.display="block";

if(page=="task")
document.getElementById("taskPage").style.display="block";

}


/* REFERRAL */

let user=Math.floor(Math.random()*100000);

document.getElementById("refLink").value=
location.href+"?ref="+user;

function copyRef(){

navigator.clipboard.writeText(
document.getElementById("refLink").value
);

alert("Link copied");

}

</script></body>
</html>
