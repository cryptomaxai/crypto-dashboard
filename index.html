<!DOCTYPE html>
<html>
<head>
<title>User Panel</title>

<style>

body{
background:#021b1b;
color:white;
font-family:sans-serif;
text-align:center;
}

.card{
background:#064e3b;
margin:20px;
padding:20px;
border-radius:10px;
}

button{
background:#22c55e;
border:none;
padding:12px;
margin:6px;
border-radius:6px;
color:white;
font-size:15px;
}

input{
padding:10px;
border-radius:6px;
border:none;
}

</style>

</head>

<body>

<h1>User Dashboard</h1>

<div class="card">

<h2>Balance: $<span id="balance">0</span></h2>

<button onclick="claim()">Claim Profit</button>

</div>


<div class="card">

<h3>Referral</h3>

<input id="refLink" style="width:80%" readonly>

<br><br>

<button onclick="copyRef()">Copy Referral</button>

<p>Referrals: <span id="refCount">0</span></p>

</div>


<div class="card">

<h3>Deposit</h3>

<p>Send USDT to this wallet</p>

<b>TXXXXXXXXXXXX</b>

</div>


<div class="card">

<h3>Withdraw</h3>

<input id="withdrawAmount" placeholder="Amount">

<br><br>

<button onclick="withdraw()">Request Withdraw</button>

</div>


<div class="card">

<a href="https://t.me/YOUR_TELEGRAM_BOT">

<button>Open Telegram Bot</button>

</a>

</div>


<script>

const API="https://crypto-backend-4g2j.onrender.com";

let userId=localStorage.getItem("uid");

if(!userId){

userId=Date.now().toString();

localStorage.setItem("uid",userId);

fetch(API+"/register",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({userId:userId})

});

}

document.getElementById("refLink").value=

location.origin+location.pathname+"?ref="+userId;


function loadUser(){

fetch(API+"/user/"+userId)

.then(r=>r.json())

.then(data=>{

document.getElementById("balance").innerText=data.balance || 0;

document.getElementById("refCount").innerText=data.referrals || 0;

});

}

loadUser();


function claim(){

fetch(API+"/claim",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({userId:userId})

})

.then(r=>r.json())

.then(data=>{

alert("New Balance: "+data.balance);

loadUser();

});

}


function copyRef(){

navigator.clipboard.writeText(

document.getElementById("refLink").value

);

alert("Referral link copied");

}


function withdraw(){

let amount=document.getElementById("withdrawAmount").value;

alert("Withdraw request: $"+amount+" sent to admin");

}

</script>

</body>
</html>
